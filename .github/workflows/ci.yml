name: Test and audit

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    env:
      AUDIT_SECRET_KEY: ci-only-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install ".[server,test]"
      - name: Compile Python sources
        run: python -m compileall -q agents glyco_mind cli.py enrichment.py simulator.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Verify audit ledger
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript
        run: |
          node --check web/annotator.mjs
          node --check web/app.mjs
      - name: Run browser engine tests
        run: node --test web/annotator.test.mjs

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime requirements and pip-audit
        run: python -m pip install ".[server]" pip-audit
      - name: Audit installed dependencies
        run: python -m pip_audit
