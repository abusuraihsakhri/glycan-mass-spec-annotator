version: '3.8'

services:
  glycan-mass-spec-annotator:
    build: .
    container_name: glycan-mass-spec-annotator
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=glycan-mass-spec-annotator-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
