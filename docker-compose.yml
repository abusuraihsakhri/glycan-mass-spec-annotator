services:
  glycan-mass-spec-annotator:
    build: .
    container_name: glycan-mass-spec-annotator
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
