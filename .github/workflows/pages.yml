name: Deploy static annotator

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTML and JavaScript
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl -fsSL --retry 6 --retry-delay 5 "$PAGE_URL" | grep -q 'id="peaks"'
          curl -fsSL --retry 6 --retry-delay 5 "${PAGE_URL%/}/app.mjs" | grep -q 'annotatePeaks'
          curl -fsSL --retry 6 --retry-delay 5 "${PAGE_URL%/}/annotator.mjs" | grep -q 'generateCandidates'
