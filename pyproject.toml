[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "glyco_mind*"]

[project]
name = "glycan-mass-spec-annotator"
version = "2.0.0"
description = "GlycoMind: N-Glycan & O-Glycan Tandem Mass Spectrometry Fragmenter Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = "MIT"
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
glycan-mass-spec-annotator = "glyco_mind.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/glycan-mass-spec-annotator"
Repository = "https://github.com/abusuraihsakhri/glycan-mass-spec-annotator.git"
